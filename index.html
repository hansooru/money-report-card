<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>돈 성적표</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/dancing-script@5/700.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', Courier, monospace;
      background: #f0ede6;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .receipt {
      width: 100%; max-width: 480px;
      background: #faf8f3;
      border-left: 0.5px solid rgba(0,0,0,0.08);
      border-right: 0.5px solid rgba(0,0,0,0.08);
      color: #1a1a18;
    }
    .tear-top { width:100%;height:16px;background:#f0ede6;position:relative;overflow:hidden; }
    .tear-top::after { content:'';position:absolute;bottom:-8px;left:-4px;right:-4px;height:16px;background:#faf8f3;border-radius:50%; }
    .tear-bot { width:100%;height:16px;background:#faf8f3;position:relative;overflow:hidden;margin-top:1rem; }
    .tear-bot::after { content:'';position:absolute;top:-8px;left:-4px;right:-4px;height:16px;background:#f0ede6;border-radius:50%; }
    .body { padding: 0 1.25rem; }
    .r-title { font-family:'Dancing Script',cursive;font-size:42px;font-weight:700;color:#FF3399;line-height:1.1;letter-spacing:1px;text-align:center;padding:0.75rem 0 0.8rem; }
    .dash { border:none;border-top:1px dashed rgba(0,0,0,0.2);margin:0.5rem 0; }
    .solid { border:none;border-top:1px solid rgba(0,0,0,0.18);margin:0.6rem 0; }
    .sec { font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#888;margin-bottom:7px;font-weight:700; }
    input.fi { width:100%;border:none;border-bottom:1.5px dashed rgba(0,0,0,0.22);background:transparent;font-family:'Courier New',monospace;font-size:12px;font-weight:700;text-align:right;color:#111;padding:2px 1px;outline:none; }
    input.fi:focus { border-bottom-color:#FF3399; }
    input.fi-lg { flex:1;min-width:0;border:none;border-bottom:1.5px dashed rgba(0,0,0,0.25);background:transparent;font-family:'Courier New',monospace;font-size:13px;font-weight:700;color:#111;padding:3px 1px;outline:none; }
    input.fi-lg:focus { border-bottom-color:#FF3399; }
    .asset-grid { display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-bottom:4px; }
    .field-lbl { font-size:10px;color:#888;letter-spacing:0.06em;margin-bottom:3px; }
    .inp-row { display:flex;align-items:center;gap:3px; }
    .unit { font-size:10px;color:#888; }
    .unit-sm { font-size:9px;color:#aaa; }
    .sub-row { display:flex;justify-content:space-between;font-size:12px;color:#444; }
    .sub-val { font-weight:700;color:#111; }
    .score-grid { display:grid;grid-template-columns:1fr auto;gap:0 16px;align-items:end; }
    .stat-row { display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px; }
    .stat-lbl { color:#888;letter-spacing:0.06em;text-transform:uppercase;font-size:9px;font-weight:700; }
    .stat-val { color:#333; }
    .bar-wrap { height:3px;background:rgba(0,0,0,0.1);border-radius:2px;margin:7px 0 2px;overflow:hidden; }
    .bar-fill { height:100%;background:#FF3399;border-radius:2px;transition:width 0.5s ease;width:0%; }
    .bar-ticks { display:flex;justify-content:space-between;font-size:8px;color:#bbb; }
    .score-box { text-align:right;padding-bottom:2px; }
    .score-lbl { font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:#888;margin-bottom:2px;font-weight:700; }
    #score-num { font-size:52px;font-weight:700;color:#ccc;letter-spacing:-2px;line-height:1; }
    #score-unit { font-size:14px;color:#FF3399;display:none; }
    #score-delta { display:none;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:4px; }
    .save-btn { width:100%;padding:9px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.18em;text-transform:uppercase;border:1px dashed #FF3399;background:transparent;color:#FF3399;cursor:pointer;margin-top:0.75rem;font-weight:700;transition:background 0.15s,color 0.15s; }
    .save-btn:hover { background:#FF3399;color:#faf8f3; }
    .save-btn:active { transform:scale(0.99); }
    #hist-blk { display:none;margin-top:0.5rem; }
    .hist-hdr { display:flex;justify-content:space-between;align-items:center;margin-bottom:7px; }
    .hist-ttl { font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:#888;font-weight:700; }
    .clear-btn { font-size:9px;color:#C94848;background:none;border:none;cursor:pointer;font-family:'Courier New',monospace;opacity:0.7;font-weight:700; }
    .clear-btn:hover { opacity:1; }
    .hist-row { display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed rgba(0,0,0,0.12); }
    .hist-row:last-child { border-bottom:none; }
    .hist-date { font-size:10px;color:#999; }
    .hist-score { font-size:11px;font-weight:700;color:#111;text-align:right; }
    .hist-delta { font-size:10px;font-weight:700;text-align:right; }
    .del-btn { background:none;border:none;cursor:pointer;font-size:11px;color:#ccc;padding:0;font-family:inherit; }
    .del-btn:hover { color:#C94848; }
    .month-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:5px 8px; }
    .year-grid { display:grid;grid-template-columns:1fr 1fr;gap:5px 12px; }
    .field-lbl-sm { font-size:10px;color:#777;margin-bottom:2px; }
    .barcode { text-align:center;padding:0.875rem 1.25rem 0; }
    .bc-lines { display:flex;justify-content:center;gap:1.5px;height:28px;align-items:flex-end;margin-bottom:4px; }
    .bc-lines span { display:inline-block;background:#1a1a18; }
    .bc-text { font-size:9px;letter-spacing:0.14em;color:#bbb; }
  </style>
</head>
<body>
<div class="receipt">
  <div class="tear-top"></div>
  <div class="body">

    <div class="r-title">돈 성적표</div>
    <hr class="dash">

    <div class="sec">🏦 현재 자산</div>
    <div class="asset-grid">
      <div>
        <div class="field-lbl">총자산</div>
        <div class="inp-row"><input type="text" class="fi-lg" id="asset-inp" placeholder="100,000,000" inputmode="numeric"><span class="unit">원</span></div>
      </div>
      <div>
        <div class="field-lbl">부부계좌 ÷2 차감</div>
        <div class="inp-row"><input type="text" class="fi-lg" id="couple-inp" placeholder="0" inputmode="numeric"><span class="unit">원</span></div>
      </div>
    </div>
    <div id="calc-hint" style="font-size:10px;color:#aaa;margin-bottom:4px;min-height:13px;"></div>
    <hr class="dash">
    <div class="sub-row"><span>실질 내 자산</span><span class="sub-val" id="asset-total">—</span></div>

    <hr class="solid">

    <div class="score-grid">
      <div>
        <div class="stat-row"><span class="stat-lbl">누적 수입</span><span class="stat-val" id="stat-income">—</span></div>
        <div class="stat-row"><span class="stat-lbl">실질 자산</span><span class="stat-val" id="stat-asset">—</span></div>
        <div class="stat-row"><span class="stat-lbl">보존율</span><span class="stat-val" id="stat-ratio">—</span></div>
        <div class="bar-wrap"><div class="bar-fill" id="score-bar"></div></div>
        <div class="bar-ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100~</span></div>
      </div>
      <div class="score-box">
        <div class="score-lbl">🏆 총점</div>
        <span id="score-num">—</span><span id="score-unit"> 점</span>
        <div id="score-delta"></div>
      </div>
    </div>

    <button class="save-btn" onclick="saveScore()">🖨️ &nbsp;점수 기록 저장</button>

    <div id="hist-blk">
      <hr class="dash">
      <div class="hist-hdr">
        <span class="hist-ttl">📋 점수 기록</span>
        <button class="clear-btn" onclick="clearAll()">전체 삭제 ✕</button>
      </div>
      <div id="hist-rows"></div>
    </div>

    <hr class="solid">

    <div class="sec">📆 2026 월별 수입</div>
    <div class="month-grid" id="month-grid"></div>
    <hr class="dash">
    <div class="sub-row"><span>2026 소계</span><span class="sub-val" id="m-total">0원</span></div>

    <hr class="solid">

    <div class="sec">📅 2020–2025 연간 수입</div>
    <div class="year-grid" id="year-grid"></div>
    <hr class="dash">
    <div class="sub-row"><span>2020–2025 소계</span><span class="sub-val" id="base-total">—</span></div>

  </div>

  <div class="barcode">
    <div class="bc-lines" id="bc"></div>
    <div class="bc-text">성과를 내자</div>
  </div>
  <div class="tear-bot"></div>
</div>

<script>
const YEAR_DATA=[
  {key:'y2020',label:'2020 · 1년차',val:30000000},{key:'y2021',label:'2021 · 2년차',val:43390000},
  {key:'y2022',label:'2022 · 3년차',val:40390000},{key:'y2023',label:'2023 · 4년차',val:44090000},
  {key:'y2024',label:'2024 · 5년차',val:59900000},{key:'y2025',label:'2025 · 6년차',val:71400000},
];
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const STORE_KEY='money_card_income',HIST_KEY='money_card_history';
let history=[],currentScore=null;

function fmt(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function parseRaw(s){return parseFloat((s||'').replace(/[^0-9.]/g,''))||0;}
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return{};}}
function saveIncome(key,val){try{const d=loadSaved();d[key]=val;localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}

const saved=loadSaved();
const inpS='width:100%;border:none;border-bottom:1.5px dashed rgba(0,0,0,0.22);background:transparent;font-family:Courier New,monospace;font-size:12px;font-weight:700;text-align:right;color:#111;padding:2px 1px;outline:none;';

document.getElementById('year-grid').innerHTML=YEAR_DATA.map((d,i)=>{
  const sv=saved[d.key],disp=sv!==undefined?Number(sv).toLocaleString('ko-KR'):d.val.toLocaleString('ko-KR');
  return `<div><div class="field-lbl-sm">${d.label}</div><div style="display:flex;align-items:center;gap:2px;"><input type="text" class="fi" data-year="${i}" data-key="${d.key}" value="${disp}" inputmode="numeric" style="${inpS}"><span class="unit-sm">원</span></div></div>`;
}).join('');

document.getElementById('month-grid').innerHTML=MONTHS.map((m,i)=>{
  const key=`m2026_${i}`,sv=saved[key],disp=sv>0?Number(sv).toLocaleString('ko-KR'):'';
  return `<div><div class="field-lbl-sm">${m}</div><div style="display:flex;align-items:center;gap:2px;"><input type="text" class="fi month-inp" data-key="${key}" placeholder="0" value="${disp}" inputmode="numeric" style="${inpS}"><span class="unit-sm">원</span></div></div>`;
}).join('');

try{history=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){}

const bc=document.getElementById('bc');
[3,1,2,1,3,2,1,1,2,3,1,2,3,1,1,2,1,3,2,1,3,1,2,2,1].forEach((w,i)=>{
  const s=document.createElement('span');s.style.cssText=`width:${w}px;height:${14+((i*7)%12)}px;`;bc.appendChild(s);
});

function ac(inp,storageKey){
  inp.addEventListener('focus',()=>{inp.value=inp.value.replace(/[^0-9]/g,'');});
  inp.addEventListener('blur',()=>{
    const r=parseFloat(inp.value.replace(/[^0-9]/g,''));
    const clean=(!isNaN(r)&&r>0)?r:0;
    inp.value=clean>0?clean.toLocaleString('ko-KR'):'';
    if(storageKey)saveIncome(storageKey,clean);
    calc();
  });
  inp.addEventListener('input',calc);
}
document.querySelectorAll('[data-year],.month-inp').forEach(inp=>ac(inp,inp.dataset.key));
ac(document.getElementById('asset-inp'),null);
ac(document.getElementById('couple-inp'),null);

function deleteEntry(i){history.splice(i,1);try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}renderHistory();updateDelta();}
function clearAll(){history=[];try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}renderHistory();updateDelta();}

function renderHistory(){
  const blk=document.getElementById('hist-blk'),rows=document.getElementById('hist-rows');
  if(!history.length){blk.style.display='none';return;}
  blk.style.display='block';
  rows.innerHTML=history.slice().reverse().map((h,ri)=>{
    const i=history.length-1-ri,prev=history[i-1];
    let dh=`<span class="hist-delta" style="color:#ccc;">—</span>`;
    if(prev){const d=h.score-prev.score,c=d>0?'#2E9E6B':d<0?'#C94848':'#ccc',ar=d>0?'▲':d<0?'▼':'─';
      dh=`<span class="hist-delta" style="color:${c};">${ar}${d>=0?'+':''}${d.toFixed(1)}</span>`;}
    return `<div class="hist-row"><span class="hist-date">${h.date}</span><span class="hist-score">${h.score.toFixed(1)}점</span>${dh}<button class="del-btn" onclick="deleteEntry(${i})">✕</button></div>`;
  }).join('');
}

function updateDelta(){
  const el=document.getElementById('score-delta');el.style.display='none';
  if(history.length<2||currentScore===null)return;
  const d=currentScore-history[history.length-2].score;
  el.style.display='block';
  el.style.background=d>0?'rgba(46,158,107,0.12)':'rgba(201,72,72,0.12)';
  el.style.color=d>0?'#2E9E6B':'#C94848';
  el.textContent=`${d>0?'▲':'▼'} 이전 대비 ${d>=0?'+':''}${d.toFixed(1)}점`;
}

function saveScore(){
  if(currentScore===null)return;
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  history.push({score:currentScore,date:`${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`});
  try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}
  renderHistory();updateDelta();
}

function calc(){
  let base=0;document.querySelectorAll('[data-year]').forEach(i=>{base+=parseRaw(i.value);});
  document.getElementById('base-total').textContent=fmt(base);
  let mo=0;document.querySelectorAll('.month-inp').forEach(i=>{mo+=parseRaw(i.value);});
  document.getElementById('m-total').textContent=fmt(mo);
  const ti=base+mo;document.getElementById('stat-income').textContent=fmt(ti);
  const ta=parseRaw(document.getElementById('asset-inp').value);
  const ca=parseRaw(document.getElementById('couple-inp').value);
  const ded=ca*0.5,ar=ta-ded;
  document.getElementById('calc-hint').textContent=(ca>0&&ta>0)?`${fmt(ta)} - ${fmt(ded)} = ${fmt(ar)}`:'';
  document.getElementById('asset-total').textContent=ar>0?fmt(ar):'—';
  document.getElementById('stat-asset').textContent=ar>0?fmt(ar):'—';
  const sn=document.getElementById('score-num');
  if(!ar||!ti){
    currentScore=null;document.getElementById('stat-ratio').textContent='—';
    sn.textContent='—';sn.style.color='#ccc';
    document.getElementById('score-unit').style.display='none';
    document.getElementById('score-bar').style.width='0%';return;
  }
  const sc=(ar/ti)*100;currentScore=sc;
  document.getElementById('stat-ratio').textContent=sc.toFixed(1)+'%';
  sn.textContent=sc.toFixed(1);sn.style.color='#FF3399';
  document.getElementById('score-unit').style.display='';
  document.getElementById('score-bar').style.width=Math.min(sc,100)+'%';
  updateDelta();
}
renderHistory();calc();
</script>
</body>
</html>
