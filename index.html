<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>돈 성적표</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #FF3399;
      --bg: #f7f5f0; --surface: #ffffff; --surface2: #f2f0eb;
      --t1: #111110; --t2: #6b6860; --bd: rgba(0,0,0,0.1); --bd2: rgba(0,0,0,0.2);
      --up: #1D9E75; --dn: #E24B4A; --r-md: 8px; --r-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111110; --surface:#1a1a18; --surface2:#222220; --t1:#f0ede6; --t2:#7a7770; --bd:rgba(255,255,255,0.08); --bd2:rgba(255,255,255,0.16); }
    }
    body { font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif; background:var(--bg); color:var(--t1); min-height:100vh; padding:2rem 1.5rem 4rem; }
    .wrap { max-width:640px; margin:0 auto; }
    .title { font-size:18px; font-weight:500; margin-bottom:1.75rem; }
    .score-hero { margin-bottom:1.5rem; }
    .score-main { display:flex; align-items:flex-end; gap:6px; margin-bottom:4px; }
    .score-val { font-size:80px; font-weight:500; color:var(--pink); letter-spacing:-3px; line-height:1; }
    .score-val.empty { color:var(--bd2); font-size:56px; letter-spacing:0; }
    .score-pt { font-size:28px; color:var(--pink); padding-bottom:10px; }
    .score-delta { font-size:13px; font-weight:500; padding:3px 10px; border-radius:20px; display:none; }
    .score-delta.up { display:inline-block; background:rgba(29,158,117,0.1); color:var(--up); }
    .score-delta.dn { display:inline-block; background:rgba(226,75,74,0.1); color:var(--dn); }
    .bar { height:2px; background:var(--bd); border-radius:1px; margin-bottom:3px; overflow:hidden; }
    .bar-fill { height:100%; background:var(--pink); border-radius:1px; transition:width 0.5s ease; width:0%; }
    .bar-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--t2); }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:1.25rem 0; }
    .stat { background:var(--surface2); border-radius:var(--r-md); padding:10px 12px; }
    .stat-label { font-size:10px; color:var(--t2); margin-bottom:5px; }
    .stat-val { font-size:14px; font-weight:500; color:var(--t1); }
    .divider { border:none; border-top:0.5px solid var(--bd); margin:1.25rem 0; }
    .sec { font-size:11px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--t2); margin-bottom:10px; }
    .sec-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
    .add-btn { font-size:11px; font-weight:500; color:var(--pink); background:none; border:1px solid var(--pink); border-radius:20px; padding:2px 10px; cursor:pointer; }
    .add-btn:hover { background:var(--pink); color:#fff; }
    .asset-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px 1.25rem; margin-bottom:6px; }
    .field { display:flex; flex-direction:column; gap:4px; }
    .field-label { font-size:11px; color:var(--t2); }
    .inp-row { display:flex; align-items:center; gap:4px; }
    input.inp { flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--bd2);background:transparent;font-family:inherit;font-size:16px;font-weight:500;color:var(--t1);padding:4px 0;outline:none; }
    input.inp:focus { border-bottom-color:var(--pink); }
    .unit { font-size:11px; color:var(--t2); }
    .unit-sm { font-size:10px; color:var(--t2); }
    .calc-hint { font-size:11px; color:var(--t2); min-height:14px; margin-top:2px; }
    .subtotal { display:flex; justify-content:space-between; align-items:baseline; margin-top:8px; }
    .sub-lbl { font-size:12px; color:var(--t2); }
    .sub-val { font-size:14px; font-weight:500; color:var(--t1); }
    .save-btn { width:100%;padding:11px;font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border:1.5px solid var(--pink);border-radius:var(--r-md);background:transparent;color:var(--pink);cursor:pointer;margin-top:1.25rem;transition:background 0.15s,color 0.15s; }
    .save-btn:hover { background:var(--pink); color:#fff; }
    .save-btn:active { transform:scale(0.99); }
    .hist-section { margin-top:1rem; display:none; }
    .hist-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
    .clear-btn { font-size:11px; color:var(--dn); background:none; border:none; cursor:pointer; font-family:inherit; opacity:0.7; }
    .clear-btn:hover { opacity:1; }
    .hist-item { display:grid; grid-template-columns:auto 1fr auto auto auto; gap:10px; align-items:center; padding:8px 6px; border-bottom:0.5px solid var(--bd); cursor:pointer; border-radius:var(--r-md); transition:background 0.1s; }
    .hist-item:last-child { border-bottom:none; }
    .hist-item:hover { background:var(--surface2); }
    .hist-date { font-size:11px; color:var(--t2); white-space:nowrap; }
    .hist-asset { font-size:11px; color:var(--t2); text-align:right; }
    .hist-score { font-size:14px; font-weight:500; text-align:right; white-space:nowrap; }
    .hist-delta { font-size:11px; font-weight:500; min-width:56px; text-align:right; }
    .del-btn { background:none;border:none;cursor:pointer;font-size:13px;color:var(--t2);padding:0;opacity:0.4; }
    .del-btn:hover { opacity:1; color:var(--dn); }
    .month-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px 1rem; }
    .mini-field { display:flex; flex-direction:column; gap:3px; }
    .mini-label { font-size:10px; color:var(--t2); }
    input.mini-inp { width:100%;border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;text-align:right;color:var(--t1);padding:3px 0;outline:none; }
    input.mini-inp:focus { border-bottom-color:var(--pink); }
    .year-row { display:grid; grid-template-columns:28px 80px 1fr auto; gap:6px; align-items:center; padding:4px 0; border-bottom:0.5px solid var(--bd); }
    .year-row:last-child { border-bottom:none; }
    .year-nth { font-size:11px; font-weight:500; color:var(--pink); white-space:nowrap; }
    input.year-name { border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--t1);padding:3px 0;outline:none;width:100%; }
    input.year-name:focus { border-bottom-color:var(--pink); }
    .year-val-wrap { display:flex; align-items:center; gap:3px; }
    input.year-val { flex:1;border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;text-align:right;color:var(--t1);padding:3px 0;outline:none; }
    input.year-val:focus { border-bottom-color:var(--pink); }
    .row-del { background:none;border:none;cursor:pointer;font-size:12px;color:var(--t2);padding:0;opacity:0.3; }
    .row-del:hover { opacity:1; color:var(--dn); }
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45); z-index:100; align-items:center; justify-content:center; padding:1rem; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface); border-radius:var(--r-lg); padding:1.5rem; width:100%; max-width:480px; max-height:90vh; overflow-y:auto; position:relative; }
    .modal-close { position:absolute; top:1rem; right:1rem; background:none; border:none; font-size:18px; cursor:pointer; color:var(--t2); }
    .modal-date { font-size:11px; color:var(--t2); margin-bottom:0.5rem; }
    .modal-score-row { display:flex; align-items:baseline; gap:6px; margin-bottom:1rem; }
    .modal-score { font-size:56px; font-weight:500; color:var(--pink); letter-spacing:-2px; line-height:1; }
    .modal-pt { font-size:20px; color:var(--pink); padding-bottom:6px; }
    .modal-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:1rem; }
    .modal-stat { background:var(--surface2); border-radius:var(--r-md); padding:8px 10px; }
    .modal-stat-label { font-size:10px; color:var(--t2); margin-bottom:3px; }
    .modal-stat-val { font-size:13px; font-weight:500; color:var(--t1); }
    .modal-sec { font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; color:var(--t2); margin:0.875rem 0 6px; }
    .modal-row { display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:0.5px solid var(--bd); }
    .modal-row:last-child { border-bottom:none; }
    .modal-row-lbl { color:var(--t2); }
    .modal-row-val { font-weight:500; color:var(--t1); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="title">💰 돈 성적표</div>
  <div class="score-hero">
    <div class="score-main">
      <span class="score-val empty" id="score-val">—</span>
      <span class="score-pt" id="score-pt" style="display:none;">점</span>
      <span class="score-delta" id="score-delta"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="score-bar"></div></div>
    <div class="bar-labels"><span>0</span><span>25</span><span>50</span><span>75</span><span>100~</span></div>
  </div>
  <div class="stats-row">
    <div class="stat"><div class="stat-label">📈 누적 총 수입</div><div class="stat-val" id="stat-income">—</div></div>
    <div class="stat"><div class="stat-label">🏦 실질 내 자산</div><div class="stat-val" id="stat-asset">—</div></div>
    <div class="stat"><div class="stat-label">📊 자산 보존율</div><div class="stat-val" id="stat-ratio">—</div></div>
  </div>

  <hr class="divider">

  <div class="sec">🏠 현재 자산</div>
  <div class="asset-grid">
    <div class="field">
      <span class="field-label">총자산</span>
      <div class="inp-row"><input type="text" class="inp" id="asset-inp" placeholder="100,000,000" inputmode="numeric"><span class="unit">원</span></div>
    </div>
    <div class="field">
      <span class="field-label">부부계좌 ÷2 차감</span>
      <div class="inp-row"><input type="text" class="inp" id="couple-inp" placeholder="0" inputmode="numeric"><span class="unit">원</span></div>
    </div>
    <div class="field">
      <span class="field-label">🪙 암호화폐</span>
      <div class="inp-row"><input type="text" class="inp" id="crypto-inp" placeholder="0" inputmode="numeric"><span class="unit">원</span></div>
    </div>
  </div>
  <div class="calc-hint" id="calc-hint"></div>
  <div class="subtotal"><span class="sub-lbl">실질 내 자산</span><span class="sub-val" id="asset-total">—</span></div>

  <button class="save-btn" onclick="saveScore()">🖨️  점수 기록 저장</button>

  <div class="hist-section" id="hist-section">
    <hr class="divider">
    <div class="hist-head">
      <span class="sec" style="margin:0;">📋 기록</span>
      <button class="clear-btn" onclick="clearAll()">전체 삭제 ✕</button>
    </div>
    <div id="hist-rows"></div>
  </div>

  <hr class="divider">
  <div class="sec">📆 올해 월별 수입</div>
  <div class="month-grid" id="month-grid"></div>
  <div class="subtotal" style="margin-top:10px;"><span class="sub-lbl">올해 소계</span><span class="sub-val" id="m-total">0원</span></div>

  <hr class="divider">
  <div class="sec-row">
    <span class="sec" style="margin:0;">📅 과거 연도 연간 수입</span>
    <button class="add-btn" onclick="addYearRow()">+ 연도 추가</button>
  </div>
  <div id="year-rows"></div>
  <div class="subtotal" style="margin-top:8px;"><span class="sub-lbl">연간 소계</span><span class="sub-val" id="base-total">—</span></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-score-row">
      <span class="modal-score" id="modal-score"></span>
      <span class="modal-pt">점</span>
    </div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-label">📈 누적 수입</div><div class="modal-stat-val" id="modal-income"></div></div>
      <div class="modal-stat"><div class="modal-stat-label">🏦 실질 자산</div><div class="modal-stat-val" id="modal-asset"></div></div>
      <div class="modal-stat"><div class="modal-stat-label">📊 보존율</div><div class="modal-stat-val" id="modal-ratio"></div></div>
    </div>
    <div class="modal-sec">📆 월별 수입</div>
    <div id="modal-months"></div>
    <div class="modal-sec">📅 연간 수입</div>
    <div id="modal-years"></div>
  </div>
</div>

<script>
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const MONTH_DEFAULTS=[4704505,4916824,5803803,4162881,0,0,0,0,0,0,0,0];
const DEFAULT_YEARS=[
  {name:'2020',val:27287098},{name:'2021',val:43399996},
  {name:'2022',val:40399996},{name:'2023',val:44099996},
  {name:'2024',val:82493095},{name:'2025',val:71396181},
];
const STORE_KEY='money_card_income', HIST_KEY='money_card_history';
let history=[],currentScore=null,currentAsset=null,yearRowCount=0;

function fmt(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function parseRaw(s){return parseFloat((s||'').replace(/[^0-9.]/g,''))||0;}
function loadSaved(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}');}catch(e){return{};}}
function saveStore(key,val){try{const d=loadSaved();d[key]=val;localStorage.setItem(STORE_KEY,JSON.stringify(d));}catch(e){}}

const saved=loadSaved();

// 월별
document.getElementById('month-grid').innerHTML=MONTHS.map((m,i)=>{
  const key=`m_${i}`,sv=saved[key];
  const disp=sv!==undefined?(sv>0?Number(sv).toLocaleString('ko-KR'):''):(MONTH_DEFAULTS[i]>0?MONTH_DEFAULTS[i].toLocaleString('ko-KR'):'');
  return `<div class="mini-field"><span class="mini-label">${m}</span><div style="display:flex;align-items:center;gap:3px;"><input type="text" class="mini-inp month-inp" data-key="m_${i}" placeholder="0" value="${disp}" inputmode="numeric"><span class="unit-sm">원</span></div></div>`;
}).join('');

function updateNth(){
  document.querySelectorAll('.year-row').forEach((row,i)=>{
    row.querySelector('.year-nth').textContent=(i+1)+'년차';
  });
}

function addYearRow(name='',val=0,storeKey=null){
  const id=yearRowCount++;
  const sk=storeKey||`yr_${id}`;
  const sv=saved[sk+'_val'];
  const sn=saved[sk+'_name'];
  const dispVal=(sv!==undefined&&sv>0)?Number(sv).toLocaleString('ko-KR'):(val>0?val.toLocaleString('ko-KR'):'');
  const dispName=sn!==undefined?sn:name;
  const div=document.createElement('div');
  div.className='year-row';
  div.id=`yr-${id}`;
  div.innerHTML=`
    <span class="year-nth"></span>
    <input type="text" class="year-name" placeholder="연도" value="${dispName}" data-skey="${sk}_name">
    <div class="year-val-wrap">
      <input type="text" class="year-val" placeholder="0" value="${dispVal}" inputmode="numeric" data-skey="${sk}_val">
      <span class="unit-sm">원</span>
    </div>
    <button class="row-del" onclick="removeYearRow('yr-${id}')">✕</button>`;
  document.getElementById('year-rows').appendChild(div);
  updateNth();
  div.querySelector('.year-name').addEventListener('input',e=>{saveStore(sk+'_name',e.target.value);calc();});
  const vi=div.querySelector('.year-val');
  vi.addEventListener('focus',()=>{vi.value=vi.value.replace(/[^0-9]/g,'');});
  vi.addEventListener('blur',()=>{const r=parseFloat(vi.value.replace(/[^0-9]/g,''));const c=(!isNaN(r)&&r>0)?r:0;vi.value=c>0?c.toLocaleString('ko-KR'):'';saveStore(sk+'_val',c);calc();});
  vi.addEventListener('input',calc);
}

function removeYearRow(id){document.getElementById(id)?.remove();updateNth();calc();}

// 월별 persist
document.querySelectorAll('.month-inp').forEach(inp=>{
  inp.addEventListener('focus',()=>{inp.value=inp.value.replace(/[^0-9]/g,'');});
  inp.addEventListener('blur',()=>{const r=parseFloat(inp.value.replace(/[^0-9]/g,''));const c=(!isNaN(r)&&r>0)?r:0;inp.value=c>0?c.toLocaleString('ko-KR'):'';saveStore(inp.dataset.key,c);calc();});
  inp.addEventListener('input',calc);
});

function ac(inp){
  inp.addEventListener('focus',()=>{inp.value=inp.value.replace(/[^0-9]/g,'');});
  inp.addEventListener('blur',()=>{const r=parseFloat(inp.value.replace(/[^0-9]/g,''));inp.value=(!isNaN(r)&&r>0)?r.toLocaleString('ko-KR'):'';calc();});
  inp.addEventListener('input',calc);
}
document.querySelectorAll('.inp').forEach(ac);

DEFAULT_YEARS.forEach((d,i)=>addYearRow(d.name,d.val,`yr_def_${i}`));
try{history=JSON.parse(localStorage.getItem(HIST_KEY)||'[]');}catch(e){}

function getYearData(){
  return [...document.querySelectorAll('.year-row')].map((row,i)=>({
    nth:i+1,
    name:row.querySelector('.year-name').value.trim(),
    val:parseRaw(row.querySelector('.year-val').value),
  }));
}

function openModal(h){
  document.getElementById('modal-date').textContent=h.date+' 기준';
  document.getElementById('modal-score').textContent=h.score.toFixed(1);
  document.getElementById('modal-income').textContent=fmt(h.totalIncome||0);
  document.getElementById('modal-asset').textContent=fmt(h.asset||0);
  document.getElementById('modal-ratio').textContent=h.score.toFixed(1)+'%';
  document.getElementById('modal-months').innerHTML=(h.months||[]).map((v,i)=>
    `<div class="modal-row"><span class="modal-row-lbl">${MONTHS[i]}</span><span class="modal-row-val">${v>0?fmt(v):'—'}</span></div>`
  ).join('');
  document.getElementById('modal-years').innerHTML=(h.yearRows||[]).map(r=>
    `<div class="modal-row"><span class="modal-row-lbl">${r.nth}년차 ${r.name}</span><span class="modal-row-val">${fmt(r.val)}</span></div>`
  ).join('');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');}
function deleteEntry(i,e){e.stopPropagation();history.splice(i,1);try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}renderHistory();updateDelta();}
function clearAll(){history=[];try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}renderHistory();updateDelta();}

function renderHistory(){
  const sec=document.getElementById('hist-section'),rows=document.getElementById('hist-rows');
  if(!history.length){sec.style.display='none';return;}
  sec.style.display='block';
  rows.innerHTML=history.slice().reverse().map((h,ri)=>{
    const i=history.length-1-ri,prev=history[i-1];
    let dh=`<span class="hist-delta" style="color:var(--t2);">—</span>`;
    if(prev){const d=h.score-prev.score,c=d>0?'var(--up)':d<0?'var(--dn)':'var(--t2)',ar=d>0?'▲':d<0?'▼':'─';
      dh=`<span class="hist-delta" style="color:${c};">${ar} ${d>=0?'+':''}${d.toFixed(1)}</span>`;}
    return `<div class="hist-item" onclick="openModal(history[${i}])">
      <span class="hist-date">${h.date}</span>
      <span class="hist-asset">${fmt(h.asset)}</span>
      <span class="hist-score">${h.score.toFixed(1)}점</span>
      ${dh}
      <button class="del-btn" onclick="deleteEntry(${i},event)">✕</button>
    </div>`;
  }).join('');
}

function updateDelta(){
  const el=document.getElementById('score-delta');
  el.className='score-delta';
  if(history.length<2||currentScore===null)return;
  const d=currentScore-history[history.length-2].score;
  el.className='score-delta '+(d>0?'up':'dn');
  el.textContent=`${d>0?'▲':'▼'} ${d>=0?'+':''}${d.toFixed(1)}점`;
}

function saveScore(){
  if(currentScore===null||currentAsset===null)return;
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  const months=[...document.querySelectorAll('.month-inp')].map(i=>parseRaw(i.value));
  const yearRows=getYearData();
  const totalIncome=yearRows.reduce((a,b)=>a+b.val,0)+months.reduce((a,b)=>a+b,0);
  history.push({score:currentScore,asset:currentAsset,totalIncome,months,yearRows,
    date:`${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`});
  try{localStorage.setItem(HIST_KEY,JSON.stringify(history));}catch(e){}
  renderHistory();updateDelta();
}

function calc(){
  const yearRows=getYearData();
  const base=yearRows.reduce((a,b)=>a+b.val,0);
  document.getElementById('base-total').textContent=fmt(base);
  let mo=0;document.querySelectorAll('.month-inp').forEach(i=>{mo+=parseRaw(i.value);});
  document.getElementById('m-total').textContent=fmt(mo);
  const ti=base+mo;document.getElementById('stat-income').textContent=fmt(ti);
  const ta=parseRaw(document.getElementById('asset-inp').value);
  const ca=parseRaw(document.getElementById('couple-inp').value);
  const cr=parseRaw(document.getElementById('crypto-inp').value);
  const deduct=ca*0.5,ar=ta-deduct+cr;
  let hint='';
  if(ta>0){
    const parts=[fmt(ta)];
    if(deduct>0)parts.push(`− ${fmt(deduct)} (부부계좌 ½)`);
    if(cr>0)parts.push(`+ ${fmt(cr)} (🪙)`);
    if(parts.length>1)hint=parts.join(' ')+` = ${fmt(ar)}`;
  }
  document.getElementById('calc-hint').textContent=hint;
  document.getElementById('asset-total').textContent=ar>0?fmt(ar):'—';
  document.getElementById('stat-asset').textContent=ar>0?fmt(ar):'—';
  const sv=document.getElementById('score-val');
  if(!ar||!ti){
    currentScore=null;currentAsset=null;
    document.getElementById('stat-ratio').textContent='—';
    sv.textContent='—';sv.className='score-val empty';
    document.getElementById('score-pt').style.display='none';
    document.getElementById('score-bar').style.width='0%';return;
  }
  const sc=(ar/ti)*100;currentScore=sc;currentAsset=ar;
  document.getElementById('stat-ratio').textContent=sc.toFixed(1)+'%';
  sv.textContent=sc.toFixed(1);sv.className='score-val';
  document.getElementById('score-pt').style.display='';
  document.getElementById('score-bar').style.width=Math.min(sc,100)+'%';
  updateDelta();
}
renderHistory();calc();
</script>
</body>
</html>
