<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>돈 성적표</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #FF3399;
      --bg: #f7f5f0; --surface: #ffffff; --surface2: #f2f0eb;
      --t1: #111110; --t2: #6b6860;
      --bd: rgba(0,0,0,0.1); --bd2: rgba(0,0,0,0.2);
      --up: #1D9E75; --dn: #E24B4A;
      --r-md: 8px; --r-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111110;--surface:#1a1a18;--surface2:#222220;--t1:#f0ede6;--t2:#7a7770;--bd:rgba(255,255,255,0.08);--bd2:rgba(255,255,255,0.16); }
    }
    body { font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;padding:2rem 1.5rem 4rem; }
    .wrap { max-width:640px;margin:0 auto; }

    /* 비밀번호 화면 */
    .lock-overlay { position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.5rem; }
    .lock-box { width:100%;max-width:320px; }
    .lock-title { font-size:24px;font-weight:500;color:var(--pink);margin-bottom:6px; }
    .lock-sub { font-size:13px;color:var(--t2);margin-bottom:2rem; }
    .lock-inp { width:100%;padding:12px 14px;font-size:16px;font-family:inherit;border:1.5px solid var(--bd2);border-radius:var(--r-md);background:var(--surface);color:var(--t1);outline:none;margin-bottom:10px; }
    .lock-inp:focus { border-color:var(--pink); }
    .lock-btn { width:100%;padding:12px;font-family:inherit;font-size:14px;font-weight:500;background:var(--pink);color:#fff;border:none;border-radius:var(--r-md);cursor:pointer;transition:opacity 0.15s; }
    .lock-btn:hover { opacity:0.88; }
    .lock-err { font-size:12px;color:var(--dn);margin-top:8px;min-height:16px; }

    /* 메인 */
    .title { font-size:18px;font-weight:500;color:var(--t1);margin-bottom:1.75rem;display:flex;justify-content:space-between;align-items:center; }
    .sync-badge { font-size:11px;color:var(--t2);display:flex;align-items:center;gap:4px; }
    .sync-dot { width:6px;height:6px;border-radius:50%;background:var(--up); }
    .sync-dot.saving { background:#F5A623; }
    .sync-dot.err { background:var(--dn); }

    .score-hero { margin-bottom:1.5rem; }
    .score-main { display:flex;align-items:flex-end;gap:6px;margin-bottom:4px; }
    .score-val { font-size:80px;font-weight:500;color:var(--pink);letter-spacing:-3px;line-height:1; }
    .score-val.empty { color:var(--bd2);font-size:56px;letter-spacing:0; }
    .score-pt { font-size:28px;color:var(--pink);padding-bottom:10px; }
    .score-delta { font-size:13px;font-weight:500;padding:3px 10px;border-radius:20px;display:none; }
    .score-delta.up { display:inline-block;background:rgba(29,158,117,0.1);color:var(--up); }
    .score-delta.dn { display:inline-block;background:rgba(226,75,74,0.1);color:var(--dn); }
    .bar { height:2px;background:var(--bd);border-radius:1px;margin-bottom:3px;overflow:hidden; }
    .bar-fill { height:100%;background:var(--pink);border-radius:1px;transition:width 0.5s ease;width:0%; }
    .bar-labels { display:flex;justify-content:space-between;font-size:10px;color:var(--t2); }
    .stats-row { display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:1.25rem 0; }
    .stat { background:var(--surface2);border-radius:var(--r-md);padding:10px 12px; }
    .stat-label { font-size:10px;color:var(--t2);margin-bottom:5px; }
    .stat-val { font-size:14px;font-weight:500;color:var(--t1); }
    .divider { border:none;border-top:0.5px solid var(--bd);margin:1.25rem 0; }
    .sec { font-size:11px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2); }
    .sec-row { display:flex;justify-content:space-between;align-items:center;margin-bottom:10px; }
    .add-btn { font-size:11px;font-weight:500;color:var(--pink);background:none;border:1px solid var(--pink);border-radius:20px;padding:2px 10px;cursor:pointer; }
    .add-btn:hover { background:var(--pink);color:#fff; }
    .asset-grid { display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 1.25rem;margin-bottom:6px; }
    .field { display:flex;flex-direction:column;gap:4px; }
    .field-label { font-size:11px;color:var(--t2); }
    .inp-row { display:flex;align-items:center;gap:4px; }
    input.inp { flex:1;min-width:0;border:none;border-bottom:1.5px solid var(--bd2);background:transparent;font-family:inherit;font-size:16px;font-weight:500;color:var(--t1);padding:4px 0;outline:none; }
    input.inp:focus { border-bottom-color:var(--pink); }
    .unit { font-size:11px;color:var(--t2); }
    .unit-sm { font-size:10px;color:var(--t2); }
    .calc-hint { font-size:11px;color:var(--t2);min-height:14px;margin-top:2px; }
    .subtotal { display:flex;justify-content:space-between;align-items:baseline;margin-top:8px; }
    .sub-lbl { font-size:12px;color:var(--t2); }
    .sub-val { font-size:14px;font-weight:500;color:var(--t1); }
    .save-btn { width:100%;padding:11px;font-family:inherit;font-size:12px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;border:1.5px solid var(--pink);border-radius:var(--r-md);background:transparent;color:var(--pink);cursor:pointer;margin-top:1.25rem;transition:background 0.15s,color 0.15s; }
    .save-btn:hover { background:var(--pink);color:#fff; }
    .save-btn:active { transform:scale(0.99); }
    .hist-section { margin-top:1rem;display:none; }
    .hist-head { display:flex;justify-content:space-between;align-items:center;margin-bottom:8px; }
    .clear-btn { font-size:11px;color:var(--dn);background:none;border:none;cursor:pointer;opacity:0.7; }
    .clear-btn:hover { opacity:1; }
    .hist-item { display:grid;grid-template-columns:auto 1fr auto auto auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:0.5px solid var(--bd);cursor:pointer;border-radius:var(--r-md);transition:background 0.1s; }
    .hist-item:last-child { border-bottom:none; }
    .hist-item:hover { background:var(--surface2); }
    .hist-date { font-size:11px;color:var(--t2);white-space:nowrap; }
    .hist-asset { font-size:11px;color:var(--t2);text-align:right; }
    .hist-score { font-size:14px;font-weight:500;color:var(--t1);text-align:right;white-space:nowrap; }
    .hist-delta { font-size:11px;font-weight:500;min-width:56px;text-align:right; }
    .del-btn { background:none;border:none;cursor:pointer;font-size:13px;color:var(--t2);padding:0;opacity:0.4; }
    .del-btn:hover { opacity:1;color:var(--dn); }
    .month-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px 1rem; }
    .mini-field { display:flex;flex-direction:column;gap:3px; }
    .mini-label { font-size:10px;color:var(--t2); }
    input.mini-inp { width:100%;border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;text-align:right;color:var(--t1);padding:3px 0;outline:none; }
    input.mini-inp:focus { border-bottom-color:var(--pink); }
    .yr-row { display:grid;grid-template-columns:44px 80px 1fr 20px;gap:8px;align-items:center;margin-bottom:8px; }
    .yr-rank { font-size:11px;color:var(--pink);font-weight:600; }
    input.yr-name { border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--t1);padding:3px 0;outline:none;width:100%; }
    input.yr-name:focus { border-bottom-color:var(--pink); }
    input.yr-val { width:100%;border:none;border-bottom:1px solid var(--bd);background:transparent;font-family:inherit;font-size:13px;font-weight:500;text-align:right;color:var(--t1);padding:3px 0;outline:none; }
    input.yr-val:focus { border-bottom-color:var(--pink); }
    .row-del { background:none;border:none;cursor:pointer;font-size:12px;color:var(--t2);padding:0;opacity:0.3;line-height:1; }
    .row-del:hover { opacity:1;color:var(--dn); }
    .modal-overlay { display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:100;align-items:center;justify-content:center;padding:1rem; }
    .modal-overlay.open { display:flex; }
    .modal { background:var(--surface);border-radius:var(--r-lg);padding:1.5rem;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;position:relative; }
    .modal-close { position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:18px;cursor:pointer;color:var(--t2); }
    .modal-date { font-size:11px;color:var(--t2);margin-bottom:0.5rem; }
    .modal-score-row { display:flex;align-items:baseline;gap:6px;margin-bottom:1rem; }
    .modal-score { font-size:56px;font-weight:500;color:var(--pink);letter-spacing:-2px;line-height:1; }
    .modal-pt { font-size:20px;color:var(--pink);padding-bottom:6px; }
    .modal-stats { display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem; }
    .modal-stat { background:var(--surface2);border-radius:var(--r-md);padding:8px 10px; }
    .modal-stat-label { font-size:10px;color:var(--t2);margin-bottom:3px; }
    .modal-stat-val { font-size:13px;font-weight:500;color:var(--t1); }
    .modal-sec { font-size:10px;font-weight:500;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2);margin:0.875rem 0 6px; }
    .modal-row { display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:0.5px solid var(--bd); }
    .modal-row:last-child { border-bottom:none; }
    .modal-row-lbl { color:var(--t2); }
    .modal-row-val { font-weight:500;color:var(--t1); }
  </style>
</head>
<body>

<!-- 비밀번호 화면 -->
<div class="lock-overlay" id="lock-overlay">
  <div class="lock-box">
    <div class="lock-title">💰 돈 성적표</div>
    <div class="lock-sub">비밀번호를 입력하세요</div>
    <input type="password" class="lock-inp" id="lock-inp" placeholder="비밀번호" autofocus>
    <button class="lock-btn" onclick="tryLogin()">입장</button>
    <div class="lock-err" id="lock-err"></div>
  </div>
</div>

<div class="wrap" id="main-wrap" style="display:none;">
  <div class="title">
    💰 돈 성적표
    <span class="sync-badge"><span class="sync-dot" id="sync-dot"></span><span id="sync-text">동기화됨</span></span>
  </div>

  <div class="score-hero">
    <div class="score-main">
      <span class="score-val empty" id="score-val">—</span>
      <span class="score-pt" id="score-pt" style="display:none;">점</span>
      <span class="score-delta" id="score-delta"></span>
    </div>
    <div class="bar"><div class="bar-fill" id="score-bar"></div></div>
    <div class="bar-labels"><span>0</span><span>25</span><span>50</span><span>75</span><span>100~</span></div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-label">📈 누적 총 수입</div><div class="stat-val" id="stat-income">—</div></div>
    <div class="stat"><div class="stat-label">🏦 실질 내 자산</div><div class="stat-val" id="stat-asset">—</div></div>
    <div class="stat"><div class="stat-label">📊 자산 보존율</div><div class="stat-val" id="stat-ratio">—</div></div>
  </div>

  <hr class="divider">
  <div class="sec" style="margin-bottom:10px;">🏠 현재 자산</div>
  <div class="asset-grid">
    <div class="field"><span class="field-label">총자산</span><div class="inp-row"><input type="text" class="inp" id="asset-inp" placeholder="100,000,000" inputmode="numeric"><span class="unit">원</span></div></div>
    <div class="field"><span class="field-label">부부계좌 ÷2 차감</span><div class="inp-row"><input type="text" class="inp" id="couple-inp" placeholder="0" inputmode="numeric"><span class="unit">원</span></div></div>
    <div class="field"><span class="field-label">🪙 암호화폐</span><div class="inp-row"><input type="text" class="inp" id="crypto-inp" placeholder="0" inputmode="numeric"><span class="unit">원</span></div></div>
  </div>
  <div class="calc-hint" id="calc-hint"></div>
  <div class="subtotal"><span class="sub-lbl">실질 내 자산</span><span class="sub-val" id="asset-total">—</span></div>

  <button class="save-btn" onclick="saveScore()">🖨️  점수 기록 저장</button>

  <div class="hist-section" id="hist-section">
    <hr class="divider">
    <div class="hist-head"><span class="sec">📋 기록</span><button class="clear-btn" onclick="clearAll()">전체 삭제 ✕</button></div>
    <div id="hist-rows"></div>
  </div>

  <hr class="divider">
  <div class="sec-row"><span class="sec">📆 올해 월별 수입</span></div>
  <div class="month-grid" id="month-grid"></div>
  <div class="subtotal" style="margin-top:10px;"><span class="sub-lbl">올해 소계</span><span class="sub-val" id="m-total">0원</span></div>

  <hr class="divider">
  <div class="sec-row"><span class="sec">📅 과거 연도 연간 수입</span><button class="add-btn" onclick="addYearRow()">+ 연도 추가</button></div>
  <div id="year-rows"></div>
  <div class="subtotal" style="margin-top:8px;"><span class="sub-lbl">연간 소계</span><span class="sub-val" id="base-total">—</span></div>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModalDirect()">✕</button>
    <div class="modal-date" id="modal-date"></div>
    <div class="modal-score-row"><span class="modal-score" id="modal-score"></span><span class="modal-pt">점</span></div>
    <div class="modal-stats">
      <div class="modal-stat"><div class="modal-stat-label">📈 누적 수입</div><div class="modal-stat-val" id="modal-income"></div></div>
      <div class="modal-stat"><div class="modal-stat-label">🏦 실질 자산</div><div class="modal-stat-val" id="modal-asset"></div></div>
      <div class="modal-stat"><div class="modal-stat-label">📊 보존율</div><div class="modal-stat-val" id="modal-ratio"></div></div>
    </div>
    <div class="modal-sec">📆 월별 수입</div>
    <div id="modal-months"></div>
    <div class="modal-sec">📅 연간 수입</div>
    <div id="modal-years"></div>
  </div>
</div>

<script>
const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
const MONTH_DEFAULTS=[4704505,4916824,5803803,4162881,0,0,0,0,0,0,0,0];
const DEFAULT_YEARS=[
  {name:'2020',val:27287098},{name:'2021',val:43399996},
  {name:'2022',val:40399996},{name:'2023',val:44099996},
  {name:'2024',val:82493095},{name:'2025',val:71396181},
];
let history=[],currentScore=null,currentAsset=null,yrCount=0,PW='';
let saveTimer=null;

// ── 인증 ──
document.getElementById('lock-inp').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});
async function tryLogin(){
  const pw=document.getElementById('lock-inp').value;
  const err=document.getElementById('lock-err');
  err.textContent='확인 중...';
  try{
    const r=await fetch('/api/data',{headers:{'x-password':pw}});
    if(r.status===401){err.textContent='비밀번호가 틀렸어요';return;}
    PW=pw;
    const data=await r.json();
    document.getElementById('lock-overlay').style.display='none';
    document.getElementById('main-wrap').style.display='block';
    initUI();
    loadData(data);
  }catch(e){err.textContent='서버 연결 실패';}
}

// ── 동기화 상태 ──
function setSyncStatus(s){
  const dot=document.getElementById('sync-dot'),txt=document.getElementById('sync-text');
  if(s==='ok'){dot.className='sync-dot';txt.textContent='동기화됨';}
  else if(s==='saving'){dot.className='sync-dot saving';txt.textContent='저장 중...';}
  else{dot.className='sync-dot err';txt.textContent='저장 실패';}
}

async function syncData(){
  setSyncStatus('saving');
  const months=[...document.querySelectorAll('.month-inp')].map(i=>parseRaw(i.value));
  const yearRows=getYears();
  const payload={
    months, yearRows, history,
    asset:parseRaw(document.getElementById('asset-inp').value),
    couple:parseRaw(document.getElementById('couple-inp').value),
    crypto:parseRaw(document.getElementById('crypto-inp').value),
  };
  try{
    const r=await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json','x-password':PW},body:JSON.stringify(payload)});
    setSyncStatus(r.ok?'ok':'err');
  }catch(e){setSyncStatus('err');}
}

function debouncedSync(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(syncData,1500);
}

// ── 데이터 로드 ──
function loadData(d){
  if(!d||!Object.keys(d).length) return;

  // 자산 입력
  if(d.asset>0) document.getElementById('asset-inp').value=d.asset.toLocaleString('ko-KR');
  if(d.couple>0) document.getElementById('couple-inp').value=d.couple.toLocaleString('ko-KR');
  if(d.crypto>0) document.getElementById('crypto-inp').value=d.crypto.toLocaleString('ko-KR');

  // 월별
  if(d.months) d.months.forEach((v,i)=>{
    const inp=document.querySelectorAll('.month-inp')[i];
    if(inp&&v>0) inp.value=v.toLocaleString('ko-KR');
  });

  // 연간
  if(d.yearRows&&d.yearRows.length){
    document.getElementById('year-rows').innerHTML='';
    yrCount=0;
    d.yearRows.forEach(r=>addYearRow(r.name,r.val));
  }

  // 기록
  if(d.history) history=d.history;
  renderHistory();
  calc();
}

// ── UI 초기화 ──
function initUI(){
  document.getElementById('month-grid').innerHTML=MONTHS.map((m,i)=>
    `<div class="mini-field"><span class="mini-label">${m}</span><div style="display:flex;align-items:center;gap:3px;"><input type="text" class="mini-inp month-inp" placeholder="0" value="${MONTH_DEFAULTS[i]>0?MONTH_DEFAULTS[i].toLocaleString('ko-KR'):''}" inputmode="numeric"><span class="unit-sm">원</span></div></div>`
  ).join('');
  DEFAULT_YEARS.forEach(d=>addYearRow(d.name,d.val));
  document.querySelectorAll('.mini-inp,.inp').forEach(acFn);
}

// ── 연도 행 ──
function refreshRanks(){document.querySelectorAll('.yr-row').forEach((r,i)=>r.querySelector('.yr-rank').textContent=`${i+1}년차`);}
function addYearRow(name='',val=0){
  const id=yrCount++;
  const d=document.createElement('div');
  d.className='yr-row';d.id=`yr-${id}`;
  d.innerHTML=`<span class="yr-rank"></span>
    <input type="text" class="yr-name" placeholder="연도" value="${name}">
    <div style="display:flex;align-items:center;gap:3px;flex:1;"><input type="text" class="yr-val" placeholder="0" value="${val>0?val.toLocaleString('ko-KR'):''}" inputmode="numeric" style="flex:1;"><span class="unit-sm">원</span></div>
    <button class="row-del" onclick="removeYr('yr-${id}')">✕</button>`;
  document.getElementById('year-rows').appendChild(d);
  refreshRanks();
  const vInp=d.querySelector('.yr-val');
  d.querySelector('.yr-name').addEventListener('input',()=>{calc();debouncedSync();});
  vInp.addEventListener('focus',()=>{vInp.value=vInp.value.replace(/[^0-9]/g,'');});
  vInp.addEventListener('blur',()=>{const r=parseFloat(vInp.value.replace(/[^0-9]/g,''));vInp.value=(!isNaN(r)&&r>0)?r.toLocaleString('ko-KR'):'';calc();debouncedSync();});
  vInp.addEventListener('input',calc);
}
function removeYr(id){document.getElementById(id)?.remove();refreshRanks();calc();debouncedSync();}

// ── 공통 ──
function fmt(n){return Math.round(n).toLocaleString('ko-KR')+'원';}
function parseRaw(s){return parseFloat((s||'').replace(/[^0-9.]/g,''))||0;}
function acFn(inp){
  inp.addEventListener('focus',()=>{inp.value=inp.value.replace(/[^0-9]/g,'');});
  inp.addEventListener('blur',()=>{const r=parseFloat(inp.value.replace(/[^0-9]/g,''));inp.value=(!isNaN(r)&&r>0)?r.toLocaleString('ko-KR'):'';calc();debouncedSync();});
  inp.addEventListener('input',calc);
}
function getYears(){return[...document.querySelectorAll('.yr-row')].map((r,i)=>({rank:`${i+1}년차`,name:r.querySelector('.yr-name').value.trim(),val:parseRaw(r.querySelector('.yr-val').value)}));}

// ── 기록 ──
function openModal(h){
  document.getElementById('modal-date').textContent=h.date+' 기준';
  document.getElementById('modal-score').textContent=h.score.toFixed(1);
  document.getElementById('modal-income').textContent=fmt(h.totalIncome||0);
  document.getElementById('modal-asset').textContent=fmt(h.asset||0);
  document.getElementById('modal-ratio').textContent=h.score.toFixed(1)+'%';
  document.getElementById('modal-months').innerHTML=(h.months||[]).map((v,i)=>`<div class="modal-row"><span class="modal-row-lbl">${MONTHS[i]}</span><span class="modal-row-val">${v>0?fmt(v):'—'}</span></div>`).join('');
  document.getElementById('modal-years').innerHTML=(h.yearRows||[]).map(r=>`<div class="modal-row"><span class="modal-row-lbl">${r.rank} · ${r.name}</span><span class="modal-row-val">${fmt(r.val)}</span></div>`).join('');
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal(e){if(e.target===document.getElementById('modal-overlay'))closeModalDirect();}
function closeModalDirect(){document.getElementById('modal-overlay').classList.remove('open');}
function deleteEntry(i,e){e.stopPropagation();history.splice(i,1);renderHistory();updateDelta();syncData();}
function clearAll(){history=[];renderHistory();updateDelta();syncData();}

function renderHistory(){
  const sec=document.getElementById('hist-section'),rows=document.getElementById('hist-rows');
  if(!history.length){sec.style.display='none';return;}
  sec.style.display='block';
  rows.innerHTML=history.slice().reverse().map((h,ri)=>{
    const i=history.length-1-ri,prev=history[i-1];
    let dh=`<span class="hist-delta" style="color:var(--t2);">—</span>`;
    if(prev){const d=h.score-prev.score,c=d>0?'var(--up)':d<0?'var(--dn)':'var(--t2)',ar=d>0?'▲':d<0?'▼':'─';dh=`<span class="hist-delta" style="color:${c};">${ar} ${d>=0?'+':''}${d.toFixed(1)}</span>`;}
    return `<div class="hist-item" onclick="openModal(history[${i}])"><span class="hist-date">${h.date}</span><span class="hist-asset">${fmt(h.asset)}</span><span class="hist-score">${h.score.toFixed(1)}점</span>${dh}<button class="del-btn" onclick="deleteEntry(${i},event)">✕</button></div>`;
  }).join('');
}

function updateDelta(){
  const el=document.getElementById('score-delta');el.className='score-delta';
  if(history.length<2||currentScore===null)return;
  const d=currentScore-history[history.length-2].score;
  el.className='score-delta '+(d>0?'up':'dn');
  el.textContent=`${d>0?'▲':'▼'} ${d>=0?'+':''}${d.toFixed(1)}점`;
}

function saveScore(){
  if(currentScore===null||currentAsset===null)return;
  const now=new Date(),p=n=>String(n).padStart(2,'0');
  const months=[...document.querySelectorAll('.month-inp')].map(i=>parseRaw(i.value));
  const yearRows=getYears();
  const totalIncome=yearRows.reduce((a,b)=>a+b.val,0)+months.reduce((a,b)=>a+b,0);
  history.push({score:currentScore,asset:currentAsset,totalIncome,months,yearRows,date:`${now.getFullYear()}.${p(now.getMonth()+1)}.${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`});
  renderHistory();updateDelta();syncData();
}

function calc(){
  const yrs=getYears();
  const base=yrs.reduce((a,b)=>a+b.val,0);
  document.getElementById('base-total').textContent=fmt(base);
  let mo=0;document.querySelectorAll('.month-inp').forEach(i=>{mo+=parseRaw(i.value);});
  document.getElementById('m-total').textContent=fmt(mo);
  const ti=base+mo;document.getElementById('stat-income').textContent=fmt(ti);
  const ta=parseRaw(document.getElementById('asset-inp').value);
  const ca=parseRaw(document.getElementById('couple-inp').value);
  const cr=parseRaw(document.getElementById('crypto-inp').value);
  const ded=ca*0.5,ar=ta-ded+cr;
  let hint='';if(ta>0){const pts=[fmt(ta)];if(ded>0)pts.push(`− ${fmt(ded)} (부부계좌 ½)`);if(cr>0)pts.push(`+ ${fmt(cr)} (🪙)`);if(pts.length>1)hint=pts.join(' ')+` = ${fmt(ar)}`;}
  document.getElementById('calc-hint').textContent=hint;
  document.getElementById('asset-total').textContent=ar>0?fmt(ar):'—';
  document.getElementById('stat-asset').textContent=ar>0?fmt(ar):'—';
  const sv=document.getElementById('score-val');
  if(!ar||!ti){currentScore=null;currentAsset=null;document.getElementById('stat-ratio').textContent='—';sv.textContent='—';sv.className='score-val empty';document.getElementById('score-pt').style.display='none';document.getElementById('score-bar').style.width='0%';return;}
  const sc=(ar/ti)*100;currentScore=sc;currentAsset=ar;
  document.getElementById('stat-ratio').textContent=sc.toFixed(1)+'%';
  sv.textContent=sc.toFixed(1);sv.className='score-val';
  document.getElementById('score-pt').style.display='';
  document.getElementById('score-bar').style.width=Math.min(sc,100)+'%';
  updateDelta();
}
</script>
</body>
</html>
